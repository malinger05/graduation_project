[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    memory: in-memory middleware state (no Postgres)
    db: requires in-memory SQLite middleware DB fixture
    integration: in-process API tests (mocked CBS)
    ui: Selenium browser tests (requires Chrome)
    ui_e2e: full-stack Selenium tests (requires running demo + UI_E2E_* env)
